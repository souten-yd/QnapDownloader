<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E2E 動的ページ</title>
<style>body{font:16px/1.7 sans-serif;margin:0;padding:12px 14px}button{font-size:18px;padding:12px 18px}.late{background:#ffd;padding:6px;margin:6px 0}</style></head><body>
<h1>スクリプトで変わるページ</h1>
<p>読み込みの少し後で段落が追加され、ボタンでも増えます。</p>
<button id="more" type="button">もっと見る</button>
<div id="list"></div>
<script>
fetch("/__beacon?e=load&p=" + encodeURIComponent(location.pathname), {cache: "no-store"}).catch(function () {});
var list = document.getElementById("list"), n = 0;
function add(text) { var d = document.createElement("div"); d.className = "late"; d.textContent = text; list.appendChild(d); }
setTimeout(function () { add("LATE-ADDED 読み込み後に追加された行"); }, 500);
document.getElementById("more").addEventListener("click", function () { n++; add("MORE-CLICKED " + n); });
</script></body></html>
