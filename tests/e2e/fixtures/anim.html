<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E2E 動くページ</title>
<style>body{font:16px/1.7 sans-serif;margin:0;color:#fff;background:#124}#a{height:240px;margin:20px;padding:16px;font-size:28px}</style></head><body>
<h1 style="margin:12px 20px">動くページ</h1>
<div id="a">frame 0</div>
<script>
// v0.1.68: a page that changes ~20 times a second, so the screencast produces frames continuously (a static page
// produces one frame only; the live-transport scenarios measure frames per second on this one).
var n = 0, box = document.getElementById("a");
setInterval(function () { n++; box.style.background = "hsl(" + (n * 23 % 360) + ",70%,45%)"; box.textContent = "frame " + n; }, 50);
fetch("/__beacon?e=load&p=" + encodeURIComponent(location.pathname), {cache: "no-store"}).catch(function () {});
</script></body></html>
