<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E2E 後から描くページ</title>
<style>body{font:16px/1.7 sans-serif;margin:0;padding:12px 14px;color:#222;background:#fff}</style>
<script>
// The body is empty at DOMContentLoaded (like many script-built sites); the content arrives later.
document.addEventListener("DOMContentLoaded", function () {
  setTimeout(function () {
    var main = document.createElement("main");
    main.innerHTML = "<h1>E2E 後から描くページ</h1><p>本文は読み込みの後でスクリプトが書き込みます。The quick brown fox jumps over the lazy dog.</p>";
    document.body.appendChild(main);
    fetch("/__beacon?e=load&p=" + encodeURIComponent(location.pathname), {cache: "no-store"}).catch(function () {});
  }, 1500);
});
</script></head><body></body></html>
