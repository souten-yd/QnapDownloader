name: QnapDownloader MVP test and QPKG candidate
on:
  push:
    branches:
      - feat/mvp-qnap-ui-persistence-updater
  workflow_dispatch:
concurrency:
  group: qnapdownloader-mvp-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  code-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full local-first verification
        run: bash scripts/verify.sh
  qpkg-build-candidate:
    needs: code-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QDK 2.5.3 cross-builder
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          command -v qbuild
      - name: Bundle MyJD runtime dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
          python3 -c "import sys; sys.path.insert(0,'vendor'); import myjdapi; print('MyJD wheel imported')"
      - name: Build and checksum QPKG candidate
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          test -s dist/QnapDownloader_0.1.0_x86_64.qpkg
          sha256sum dist/*.qpkg > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qnapdownloader-v0.1.0-qpkg-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7
