name: QnapDownloader MVP verification (temporary branch only)
on:
  push:
    branches:
      - feat/mvp-qnap-ui-persistence-updater
  workflow_dispatch:
jobs:
  code-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact local verification
        run: bash scripts/verify.sh
