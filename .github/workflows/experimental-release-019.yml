name: Publish QnapDownloader v0.1.9-rc1 browser-style admin UI
on:
  push:
    branches: [release/experimental-0.1.9-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full unit, web, shell and safety verification
        run: bash scripts/verify.sh
      - name: Install QDK 2.5.3 and build-only dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
      - name: Build and checksum x86_64 QPKG
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.9_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.9-rc1 >/dev/null 2>&1; then
            echo 'Existing tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.1.9-rc1 dist/QnapDownloader_0.1.9_x86_64.qpkg dist/SHA256SUMS \
            --repo "${{ github.repository }}" --target "1dca909558ef7fca46bf13d8cb9e34b660173d1f" \
            --title "QnapDownloader v0.1.9-rc1: Browser-style admin UI" \
            --prerelease \
            --notes "Experimental QNAP x86_64 build: the Web UI is now browser-style. Admin screens (Downloads / Links / Settings) are pinned, non-closable tabs; web browsing uses up to 6 closable sandboxed iframe tabs with an omnibox, bookmarks bar and New Tab page. iPhone uses a Safari-style bottom toolbar and tab switcher. Downloads view adds client-side filters/search and an opt-in visible-only auto refresh (default OFF). Backend API, CSP, cookies and JD2 behaviour are unchanged; iframe sandbox stays without allow-same-origin/popups/downloads. Verified by verify.sh and headless Chrome; TS-253Be and iPhone Safari hardware checks are still pending. Never port-forward 17864 to the Internet."
