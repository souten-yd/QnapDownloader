name: Publish experimental QnapDownloader QPKG v0.1.1-rc1
on:
  push:
    branches: [release/experimental-0.1.1-rc1]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/verify.sh
      - name: Install QDK and vendor secure MyJD transport
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
      - name: QPKG build and digest
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.1_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish prerelease for NAS validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1-rc1 >/dev/null 2>&1; then
            echo 'Release already exists, refusing overwrite'
            exit 1
          fi
          gh release create v0.1.1-rc1 dist/QnapDownloader_0.1.1_x86_64.qpkg dist/SHA256SUMS             --repo "${{ github.repository }}" --target "06b497cc99f567d356bece735b37f2f7b54abe62"             --title "QnapDownloader v0.1.1-rc1 (experimental / QNAP unverified)"             --prerelease             --notes "Experimental QNAP x86_64 QPKG. 50 automated tests and QDK build passed. NAS hardware and live JD2 were NOT tested. Manual authenticated LinkGrabber sending requires explicit NAS path mapping and opt-in, never auto-starts, never auto-retries uncertain results. Packagizer rules are not modified and flat saving is not guaranteed without live verification. Browser, Rapidgator discovery and CNL are not implemented. Preserve backups and existing Docker/JD2."
