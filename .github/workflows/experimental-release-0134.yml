name: Publish QnapDownloader v0.1.34-rc1 reader size
on:
  push:
    branches: [release/experimental-0.1.34-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full unit, web, shell and safety verification
        run: bash scripts/verify.sh
      - name: Install QDK 2.5.3 and build-only dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
      - name: Build and checksum x86_64 QPKG
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.34_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.34-rc1 >/dev/null 2>&1; then
            echo 'Existing tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.1.34-rc1 dist/QnapDownloader_0.1.34_x86_64.qpkg dist/SHA256SUMS \
            --repo "${{ github.repository }}" --target "f9e8e9d113041992b09d11cc0c0fb044895c7044" \
            --title "QnapDownloader v0.1.34-rc1: Reader text size, tap-friendly links, iOS stream" \
            --prerelease \
            --notes "Experimental QNAP x86_64 build. Reader display gains a text size switch (per device) and shows rows of short links such as page numbers as large buttons. Live display keeps the push stream on iOS Safari (first frame detected without a load event) and the speed overlay names the reason when it falls back to polling."
