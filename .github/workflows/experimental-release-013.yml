name: Publish QnapDownloader QPKG v0.1.3-rc1 with LAN Web UI and icons
on:
  push:
    branches: [release/experimental-0.1.3-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 66+ tests and static safety
        run: bash scripts/verify.sh
      - name: Install QDK and build-time icon dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
      - name: Build x86_64 QPKG with iOS/QNAP icons
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.3_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.3-rc1 >/dev/null 2>&1; then
            echo 'Tag already exists; refusing to overwrite existing release'
            exit 1
          fi
          gh release create v0.1.3-rc1 dist/QnapDownloader_0.1.3_x86_64.qpkg dist/SHA256SUMS             --repo "${{ github.repository }}" --target "d12078b2172c692160841bf1a4bf8abded962220"             --title "QnapDownloader v0.1.3-rc1: LAN Web UI / iPhone & QNAP icons (QTS validation)"             --prerelease             --notes "Experimental QNAP TS-253Be x86_64 package. Fix: default private-LAN Web access at http://<NAS-LAN-IP>:17864/ instead of loopback-only. Adds iPhone Safari home icon and QNAP App Center icons, startup diagnostics, private-peer and Host filtering. 66 Python tests and QDK 2.5.3 x86_64 build passed. WARNING: LAN HTTP is not encrypted; NEVER port-forward 17864. Prefer HTTPS reverse proxy/VPN, or set config/network-mode to loopback. No changes to Docker/JD2, stored data or download defaults. Hardware installation/startup must still be checked on the real QNAP. Existing prerelease users must update manually in App Center."
