name: Publish QnapDownloader v0.1.24-rc1 site rules and speed
on:
  push:
    branches: [release/experimental-0.1.24-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full unit, web, shell and safety verification
        run: bash scripts/verify.sh
      - name: Install QDK 2.5.3 and build-only dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
      - name: Build and checksum x86_64 QPKG
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.24_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.24-rc1 >/dev/null 2>&1; then
            echo 'Existing tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.1.24-rc1 dist/QnapDownloader_0.1.24_x86_64.qpkg dist/SHA256SUMS \
            --repo "${{ github.repository }}" --target "7aba06e210f145d58f1797b6f2f192126032b204" \
            --title "QnapDownloader v0.1.24-rc1: Start after send, per-site rules, long-press, faster NAS browser" \
            --prerelease \
            --notes "Experimental QNAP x86_64 build. Links sent to JD2 start downloading right away (setting, default on) and JD2 waiting links can be started from the Downloads page. Per-site rules: auto-send hoster links, popup ask/allow/block, ad-blocking exceptions. Long-press a link in the NAS browser to follow redirectors in a hidden page and find the download links. Faster NAS browser: ad/tracker blocking, 1x render mode by default, 4 raster threads, reduced motion, speed overlay. Re-run NAS browser setup after updating."
