name: Publish QnapDownloader v0.1.33-rc1 UI overhaul
on:
  push:
    branches: [release/experimental-0.1.33-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full unit, web, shell and safety verification
        run: bash scripts/verify.sh
      - name: Install QDK 2.5.3 and build-only dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
      - name: Build and checksum x86_64 QPKG
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.33_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.33-rc1 >/dev/null 2>&1; then
            echo 'Existing tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.1.33-rc1 dist/QnapDownloader_0.1.33_x86_64.qpkg dist/SHA256SUMS \
            --repo "${{ github.repository }}" --target "2add1f01ae9c84e166a8762d3af1bc58f923d736" \
            --title "QnapDownloader v0.1.33-rc1: UI/UX and processing overhaul" \
            --prerelease \
            --notes "Experimental QNAP x86_64 build. Settings consolidated into four sections (JD2, Browser, Connection, System) with one-line descriptions, switches and a bottom-sheet folder picker; at most one toast at a time. A single /api/state long-poll and one visibility-gated scheduler replace scattered status polling (home view: 7 to 3 requests in the first 10 s), backed by server-side single-flight caches. Unused endpoints and styles removed."
