name: Publish experimental QnapDownloader QPKG v0.1.0-rc1
on:
  push:
    branches:
      - release/experimental-0.1.0-rc1
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source
        run: bash scripts/verify.sh
      - name: Install QDK 2.5.3
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          command -v qbuild
      - name: Prepare MyJDownloader dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
          python3 -c "import sys;sys.path.insert(0,'vendor');import myjdapi;print('MyJD loaded')"
      - name: Build package and verify digest
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          test -s dist/QnapDownloader_0.1.0_x86_64.qpkg
          (cd dist && sha256sum QnapDownloader_0.1.0_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish as explicit prerelease (never stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-rc1 >/dev/null 2>&1; then
            echo "Tag already has a release; refusing to overwrite it"
            exit 1
          fi
          gh release create v0.1.0-rc1 dist/QnapDownloader_0.1.0_x86_64.qpkg dist/SHA256SUMS             --repo "${{ github.repository }}"             --target "34bcef8b7c05dafd2ad105ce88ed529af03ad922"             --title "QnapDownloader v0.1.0-rc1 (experimental / QNAP unverified)"             --prerelease             --notes "Experimental management-shell build for QNAP x86_64. 45 automated tests and QDK packaging passed. NOT YET TESTED ON QNAP HARDWARE. Does not modify an existing Docker/JD2 installation. Browser, Rapidgator discovery, CNL, and complete JD2 preset reapply are not implemented. MyJD requires opt-in NAS config. Install manually only for validation. Preserve backups."
