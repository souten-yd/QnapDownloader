name: Verify real myjdapi constructor
on:
  push:
    branches: [fix/myjd-library-constructor]
concurrency:
  group: myjd-constructor-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/verify.sh
      - name: Install actual pinned MyJD wheel and test class constructor
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
          PYTHONPATH=vendor python3 -c "import myjdapi; assert callable(myjdapi.Myjdapi); api=myjdapi.Myjdapi(); assert callable(api.connect); print('Myjdapi 1.1.11 constructor OK')"
