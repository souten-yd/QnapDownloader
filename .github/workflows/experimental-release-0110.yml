name: Publish QnapDownloader v0.1.10-rc1 Tailscale, Cloudflare compat, smoother UI
on:
  push:
    branches: [release/experimental-0.1.10-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full unit, web, shell and safety verification
        run: bash scripts/verify.sh
      - name: Install QDK 2.5.3 and build-only dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
      - name: Build and checksum x86_64 QPKG
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.10_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.10-rc1 >/dev/null 2>&1; then
            echo 'Existing tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.1.10-rc1 dist/QnapDownloader_0.1.10_x86_64.qpkg dist/SHA256SUMS \
            --repo "${{ github.repository }}" --target "0453812d5b10e96a39c02fdad281c77b6d0b7357" \
            --title "QnapDownloader v0.1.10-rc1: Tailscale, Cloudflare compat mode, smoother UI" \
            --prerelease \
            --notes "Experimental QNAP x86_64 build. Hides the plain-HTTP warning over Tailscale. Adds an opt-in per-tab compat mode so legitimate Cloudflare checks can complete (site keeps its own cookies; Hub host and *.ts.net are rejected; iPhone Safari may still block third-party cookies). Caps live iframes (1 on phones, 3 on desktop) to avoid iOS web-app reloads, keeps views populated while refreshing, and reloads the page automatically after a Hub update (re-login required). Backend unchanged otherwise. Hardware checks pending."
