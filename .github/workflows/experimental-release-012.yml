name: Publish experimental QnapDownloader QPKG v0.1.2-rc1
on:
  push:
    branches: [release/experimental-0.1.2-rc1]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/verify.sh
      - name: Install QDK 2.5.3 and prepare MyJD deps
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
      - name: QPKG build and verify checksum
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.2_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2-rc1 >/dev/null 2>&1; then
            echo 'Release already exists, refusing overwrite'
            exit 1
          fi
          gh release create v0.1.2-rc1 dist/QnapDownloader_0.1.2_x86_64.qpkg dist/SHA256SUMS             --repo "${{ github.repository }}" --target "6d93edc11b4202614713b67a4515f733d57522ff"             --title "QnapDownloader v0.1.2-rc1 (experimental / QNAP unverified)"             --prerelease             --notes "Experimental QNAP x86_64 build; 59 automated tests and QDK build passed. NAS physical deployment and live JD2 remain unverified. New safe paste-only Rapidgator/rg.to URL extraction with manual digest-confirmed staging; no server-side browsing, script execution, automatic JD2 sending or downloads. Browser sandbox and Click'n'Load are not implemented. Existing Docker/JD2 untouched."
