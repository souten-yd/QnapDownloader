name: Publish QnapDownloader v0.1.8-rc1 low IO and JD2 local diagnostics
on:
  push:
    branches: [release/experimental-0.1.8-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full unit, web, shell and safety verification
        run: bash scripts/verify.sh
      - name: Install QDK 2.5.3 and build-only dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
      - name: Build and checksum x86_64 QPKG
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.8_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.8-rc1 >/dev/null 2>&1; then
            echo 'Existing tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.1.8-rc1 dist/QnapDownloader_0.1.8_x86_64.qpkg dist/SHA256SUMS \
            --repo "${{ github.repository }}" --target "742a041e0fa90b2f017f044d7f85ddc2944bd8f1" \
            --title "QnapDownloader v0.1.8-rc1: Low I/O diagnostics and localhost JD2 presence" \
            --prerelease \
            --notes "Experimental QNAP x86_64 build: Hub stdout/stderr no longer append to persistent HDD logs by default; only 64 bounded in-RAM anonymous events remain. Disk log can be enabled temporarily by admin for troubleshooting. Adds authenticated manual Hub /proc/self/io statistics and fixed 127.0.0.1:3128 TCP-only JD2 port preflight. This is NOT a local JD2 control implementation; no unauthenticated API, Docker mutation, download commands, Java/JD2 packaging or secret operations are enabled. Users must verify Docker localhost network isolation before enabling any legacy JD2 protocol. 95 unit tests and QDK build pass. Real QTS disk I/O and Docker security still require hardware acceptance. Never port-forward ports 17864/3128 to the Internet."
