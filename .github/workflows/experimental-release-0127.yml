name: Publish QnapDownloader v0.1.27-rc1 parallel long-press
on:
  push:
    branches: [release/experimental-0.1.27-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full unit, web, shell and safety verification
        run: bash scripts/verify.sh
      - name: Install QDK 2.5.3 and build-only dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
      - name: Build and checksum x86_64 QPKG
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.27_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.27-rc1 >/dev/null 2>&1; then
            echo 'Existing tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.1.27-rc1 dist/QnapDownloader_0.1.27_x86_64.qpkg dist/SHA256SUMS \
            --repo "${{ github.repository }}" --target "515d8120dea9e5efc4e1bf088c62049c41a5a4c7" \
            --title "QnapDownloader v0.1.27-rc1: Parallel long-press checks, compact UI" \
            --prerelease \
            --notes "Experimental QNAP x86_64 build. Several long-press link checks can run at once (3 per tab, 4 overall, queued beyond that) with a small 'checking N' chip instead of a large panel; each result is sent to JD2 on its own. The keyboard bar appears only when a text field in the page is focused. No NAS browser re-setup needed."
