name: Publish QnapDownloader v0.1.30-rc1 reader mode
on:
  push:
    branches: [release/experimental-0.1.30-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full unit, web, shell and safety verification
        run: bash scripts/verify.sh
      - name: Install QDK 2.5.3 and build-only dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
      - name: Build and checksum x86_64 QPKG
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.30_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.30-rc1 >/dev/null 2>&1; then
            echo 'Existing tag; refusing to overwrite'
            exit 1
          fi
          gh release create v0.1.30-rc1 dist/QnapDownloader_0.1.30_x86_64.qpkg dist/SHA256SUMS \
            --repo "${{ github.repository }}" --target "dc84e7066a0b3d4141338b76e1529cccddd78be7" \
            --title "QnapDownloader v0.1.30-rc1: Reader mode, link recognition, live stream" \
            --prerelease \
            --notes "Experimental QNAP x86_64 build. NAS browser gains a Reader display (native text, images and links rebuilt safely on the phone), link recognition with near-miss tolerance in every display, and a push stream for Live mode instead of request-per-frame polling. Default display method is selectable in settings; Safari open options are removed; the fallback bar no longer overflows. Re-run NAS browser setup is not required."
