name: Verify LAN-first Web UI and QNAP/iOS icon payload
on:
  push:
    branches:
      - fix/lan-web-ui-and-app-icons
  workflow_dispatch:
concurrency:
  group: qnap-web-icons-fix
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/verify.sh
      - name: Render and validate actual iOS and QDK icons
        run: |
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
          python3 scripts/render-icons.py web /tmp/qnapdownloader-icons
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for directory, sizes in [(Path('web'), {'apple-touch-icon.png':180,'icon-192.png':192}),
                                  (Path('/tmp/qnapdownloader-icons'), {'QnapDownloader.png':256,'QnapDownloader_80.png':80,'QnapDownloader_gray.png':80})]:
              for name, size in sizes.items():
                  image=Image.open(directory/name)
                  assert image.size==(size,size), (name,image.size)
                  image.verify()
          print("All five PNGs decoded and dimensions match")
          PY
  package:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QDK and build-only render dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
      - name: Build 0.1.3 package and checksum
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.3_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: QnapDownloader-0.1.3-rc1-hardware-validation
          path: dist/
          if-no-files-found: error
          retention-days: 7
