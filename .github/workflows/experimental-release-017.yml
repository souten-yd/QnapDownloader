name: Publish QnapDownloader v0.1.7-rc1 mobile download overview
on:
  push:
    branches: [release/experimental-0.1.7-rc1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full source regression and safety checks
        run: bash scripts/verify.sh
      - name: QDK and build-only dependencies
        run: |
          curl -fLSs --retry 2 https://github.com/qnap-dev/QDK/releases/download/v2.5.3/qdk_2.5.3_amd64.deb -o /tmp/qdk.deb
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qdk.deb rsync
          python3 -m pip install --disable-pip-version-check 'cairosvg==2.8.2' 'pillow>=10,<13'
          python3 -m pip install --disable-pip-version-check --only-binary=:all: --target vendor -r requirements-jd2-build.txt
      - name: Build and verify x86_64 package
        run: |
          bash scripts/build-qpkg.sh x86_64 dist
          (cd dist && sha256sum QnapDownloader_0.1.7_x86_64.qpkg > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish explicitly as experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.7-rc1 >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          gh release create v0.1.7-rc1 dist/QnapDownloader_0.1.7_x86_64.qpkg dist/SHA256SUMS \
            --repo "${{ github.repository }}" --target "b8f5716f63df1449f66f94cb50633a0868dac9c3" \
            --title "QnapDownloader v0.1.7-rc1: Mobile-friendly read-only JD2 downloads" \
            --prerelease \
            --notes "Experimental QNAP TS-253Be x86_64 build. Adds a mobile-friendly Downloads tab, JD2 package and file progress bars, speed/ETA, manual 30-item paging, dashboard shortcuts and clearer disconnected/empty/error states. Authenticated MyJD downloadsV2 read-only queries use strict field allowlists; no URL/password/path fields are delivered to browsers. 89 tests and QDK build passed. Does NOT implement download start/pause/delete, premium-account management, or embedded JD2/Java yet. Existing Docker/JD2 remains untouched. Must verify against a real JD2 and QTS before marking stable. Use trusted LAN/HTTPS; never forward port 17864 to the Internet."
